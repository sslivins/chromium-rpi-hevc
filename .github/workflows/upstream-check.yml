name: upstream-check

# Daily check for newer chromium versions in RPi-Distro/chromium.
# When a newer tag is found than what we have pinned in build/cli.sh
# we open a tracking issue (one open issue at a time). The issue is the
# notification mechanism — GitHub will email/web-notify the watcher.

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC daily (~05:17 PT / 06:17 PT)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned version with latest RPi-Distro tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # build/cli.sh declares this as `readonly CHROMIUM_VERSION_FULL=...`
          # but accept either form so a future drop of `readonly` doesn't break us.
          # `|| true` keeps `set -o pipefail` from masking the proper error message
          # below — without it, a missed match aborts the whole step silently.
          PINNED="$(grep -E '^(readonly[[:space:]]+)?CHROMIUM_VERSION_FULL=' build/cli.sh \
                    | head -1 | cut -d'"' -f2 || true)"
          if [ -z "${PINNED}" ]; then
            echo "::error::Could not parse CHROMIUM_VERSION_FULL from build/cli.sh"
            exit 1
          fi
          echo "Pinned: ${PINNED}"

          # RPi-Distro tags chromium releases as pios/1%<version>
          # (the '%' substitutes for the ':' epoch separator that git tags reject).
          # We only consider deb13 (trixie) +rpt tags to match what we ship.
          mapfile -t TAGS < <(
            gh api -H "Accept: application/vnd.github+json" \
              "/repos/RPi-Distro/chromium/tags?per_page=100" \
              --jq '.[].name' \
            | grep -E '^pios/1%[0-9].*_deb13u1\+rpt[0-9]+$' || true
          )
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "::warning::No matching pios/...deb13u1+rpt tags returned"
            exit 0
          fi

          # Convert "pios/1%<deb-version>" -> "<deb-version>" and dpkg-sort.
          # Git tags can't contain '~', so RPi-Distro tags use '_' before deb13u1
          # (e.g. tag '...-1_deb13u1+rpt1' -> deb version '...-1~deb13u1+rpt1').
          # (dpkg is preinstalled on ubuntu-latest runners.)
          BEST=""
          for tag in "${TAGS[@]}"; do
            ver="${tag#pios/1%}"
            ver="${ver/_deb13u1/~deb13u1}"
            if [ -z "${BEST}" ] || dpkg --compare-versions "${ver}" gt "${BEST}"; then
              BEST="${ver}"
            fi
          done
          echo "Latest matching: ${BEST}"

          if dpkg --compare-versions "${BEST}" le "${PINNED}"; then
            echo "Up to date — nothing to do."
            exit 0
          fi

          TITLE="Upstream chromium update available: ${BEST}"

          # Idempotent: if ANY issue (open or closed) with this exact title exists, skip.
          # If the user closes it without bumping, that's still "I've seen it"; we don't
          # want to spam a new one every day.
          EXISTING="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
                        --state all --label upstream-update \
                        --json number,title \
                        --jq ".[] | select(.title == \"${TITLE}\") | .number" \
                      | head -1 || true)"
          if [ -n "${EXISTING}" ]; then
            echo "Tracking issue already exists: #${EXISTING}"
            exit 0
          fi

          # Ensure the label exists (ignore "already exists" errors).
          gh label create upstream-update \
            --color B60205 --description "RPi-Distro chromium has a newer tag than we ship" \
            --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true

          BEST_TAG_VER="${BEST/~deb13u1/_deb13u1}"
          BEST_URL_VER="${BEST_TAG_VER//+/%2B}"
          PINNED_TAG_VER="${PINNED/~deb13u1/_deb13u1}"
          PINNED_TAG="pios/1%${PINNED_TAG_VER}"
          BEST_TAG="pios/1%${BEST_TAG_VER}"

          # Summarize the RPi-Distro packaging delta rather than dumping a
          # potentially enormous patch. Same-version rpt bumps are usually
          # small enough for this to explain exactly why the release exists;
          # milestone bumps remain bounded to 20 commits and 50 files.
          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }
          COMPARE_JSON="$(mktemp)"
          PINNED_REF="$(encode_ref "${PINNED_TAG}")"
          BEST_REF="$(encode_ref "${BEST_TAG}")"
          if gh api \
              "/repos/RPi-Distro/chromium/compare/${PINNED_REF}...${BEST_REF}" \
              > "${COMPARE_JSON}"; then
            COMMITS="$(jq -r '.total_commits' "${COMPARE_JSON}")"
            FILES="$(jq -r '.files | length' "${COMPARE_JSON}")"
            ADDITIONS="$(jq -r '[.files[].additions] | add // 0' "${COMPARE_JSON}")"
            DELETIONS="$(jq -r '[.files[].deletions] | add // 0' "${COMPARE_JSON}")"
            COMMIT_LIST="$(jq -r '
              .commits[:20][] |
              "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"
            ' "${COMPARE_JSON}")"
            FILE_LIST="$(jq -r '
              .files[:50][] |
              "- `\(.filename)` — \(.status), +\(.additions)/-\(.deletions)"
            ' "${COMPARE_JSON}")"
            DELTA_SUMMARY="$(cat <<EOF
          ## RPi-Distro packaging delta

          **${COMMITS} commits, ${FILES} files, +${ADDITIONS}/-${DELETIONS} lines**

          ### Commits (first 20)

          ${COMMIT_LIST}

          <details>
          <summary>Changed packaging files (first 50)</summary>

          ${FILE_LIST}

          </details>

          Compare: https://github.com/RPi-Distro/chromium/compare/${PINNED_REF}...${BEST_REF}
          EOF
            )"
          else
            DELTA_SUMMARY="Packaging comparison unavailable; inspect the two upstream tags manually."
          fi
          rm -f "${COMPARE_JSON}"

          BODY="$(cat <<EOF
          @sslivins — a newer chromium release is available from RPi-Distro.

          | Source | Version |
          | --- | --- |
          | Currently pinned (\`build/cli.sh\`) | \`${PINNED}\` |
          | Latest RPi-Distro \`pios/...+rpt*\` tag | \`${BEST}\` |

          Upstream tag: https://github.com/RPi-Distro/chromium/tree/pios/1%25${BEST_URL_VER}

          ${DELTA_SUMMARY}

          ## Suggested workflow
          1. Run \`scripts/vendor-upstream-source.sh --publish ${BEST}\`.
          2. Update the source pins and \`CHROMIUM_BUILD_DEPS_VERSION\`.
          3. Re-apply our patch series; refresh any that fail.
          4. Build, install on a Pi, verify HEVC playback, and tag using the documented Chromium-based version.

          _This issue was opened automatically by \`.github/workflows/upstream-check.yml\`._
          EOF
          )"

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --label upstream-update \
            --assignee sslivins \
            --body "${BODY}"
